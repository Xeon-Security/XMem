[workspace]
resolver = "3"
members = [
    "crates/xmem-core",
    "crates/xmem-windows",
    "crates/xmem-memory",
    "crates/xmem-pe",
    "crates/xmem-forensics",
    "crates/xmem-experiments",
    "crates/xmem-detection",
    "crates/xmem-cli",
    "crates/xmem-gui",
    "lab/targets/xmem-target",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["kalpha <dev@kalpha.kr>"]

[workspace.dependencies]
xmem-core = { path = "crates/xmem-core" }
xmem-windows = { path = "crates/xmem-windows" }
xmem-memory = { path = "crates/xmem-memory" }
xmem-pe = { path = "crates/xmem-pe" }
xmem-forensics = { path = "crates/xmem-forensics" }
xmem-experiments = { path = "crates/xmem-experiments" }
xmem-detection = { path = "crates/xmem-detection" }
xmem-gui = { path = "crates/xmem-gui" }
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }
minidump = "0.27"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
